trigger:
  batch: true
  branches:
    include:
    - main
    - release/6.0

pr: none

variables:
- template: /eng/common-variables.yml@self

resources:
  containers:
  - container: LinuxContainer
    image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-helix-amd64

  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    pool:
      name: NetCore1ESPool-Svc-Internal
      image: windows.vs2019.amd64
      os: windows
    sdl:
      policheck:
        enabled: true
      tsa:
        enabled: true
      binskim:
        disabled: true
    stages:
    - stage: build
      displayName: Build
      jobs:
      - ${{ if and(ne(variables['System.TeamProject'], 'public'), notin(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
        - template: /eng/common/templates-official/job/onelocbuild.yml@self
          parameters:
            MirrorRepo: arcade
            LclSource: lclFilesFromPackage
            LclPackageId: 'LCL-JUNO-PROD-ARCADE'
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          artifacts:
            publish:
              artifacts: true
              logs: true
              manifests: true
          enableMicrobuild: true
          enablePublishUsingPipelines: true
          enableSourceIndex: true
          enableSourceBuild: true
          sourceBuildParameters:
            defaultManagedPlatform:
              name: Managed
              # Keep Node task handlers on the host without changing the source-build image.
              container: ''
              buildScript: >-
                docker run --rm --init
                --user "$(id -u):$(id -g)"
                --env HOME=/tmp
                --env TF_BUILD --env BUILD_BUILDNUMBER --env BUILD_SOURCEBRANCH --env BUILD_SOURCEVERSION
                --env BUILD_BUILDID --env BUILD_REPOSITORY_NAME --env SYSTEM_DEFINITIONID
                --env BUILD_REPOSITORY_URI --env BUILD_SOURCESDIRECTORY --env BUILD_ARTIFACTSTAGINGDIRECTORY
                --env SYSTEM_TEAMPROJECT --env SYSTEM_COLLECTIONURI --env SYSTEM_TEAMFOUNDATIONCOLLECTIONURI
                --env POSTBUILDSIGN
                --volume /etc/passwd:/etc/passwd:ro
                --volume /etc/group:/etc/group:ro
                --volume "$(Pipeline.Workspace):$(Pipeline.Workspace)"
                --workdir "$(Build.SourcesDirectory)"
                mcr.microsoft.com/dotnet-buildtools/prereqs:centos-7
                ./build.sh
          workspace:
            clean: all
          jobs:
          - job: Windows_NT
            timeoutInMinutes: 90
            strategy:
              matrix:
                Build_Release:
                  _BuildConfig: Release
            preSteps:
            - checkout: self
              clean: true
            steps:
            - script: eng\common\cibuild.cmd
                -configuration $(_BuildConfig)
                -prepareMachine
                $(_InternalBuildArgs)
                /p:Test=false
              displayName: Windows Build / Publish

    - stage: ValidateSdk
      displayName: Validate Arcade SDK
      dependsOn: build
      jobs:
      - template: /eng/validate-sdk.yml@self
        parameters:
          buildArgs: -configuration $(_BuildConfig)
            -prepareMachine
            $(_InternalBuildArgs)
            /p:Test=false

    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        publishingInfraVersion: 3
        # signing validation will not run, even if the below value is 'true', if the 'PostBuildSign' variable is set to 'true'
        enableSigningValidation: false
        # Sourcelink validation isn't passing for Arcade due to some regressions. This should be
        # enabled back once this issue is resolved: https://github.com/dotnet/arcade/issues/2912
        enableSourceLinkValidation: false
        publishDependsOn:
        - Validate
        - ValidateSdk
        # This is to enable SDL runs part of Post-Build Validation Stage
        SDLValidationParameters:
          enable: true
          continueOnError: false
          params: ' -SourceToolsList @("policheck","credscan")
          -TsaInstanceURL $(_TsaInstanceURL)
          -TsaProjectName $(_TsaProjectName)
          -TsaNotificationEmail $(_TsaNotificationEmail)
          -TsaCodebaseAdmin $(_TsaCodebaseAdmin)
          -TsaBugAreaPath $(_TsaBugAreaPath)
          -TsaIterationPath $(_TsaIterationPath)
          -TsaRepositoryName "Arcade"
          -TsaCodebaseName "Arcade"
          -TsaPublish $True
          -PoliCheckAdditionalRunConfigParams @("UserExclusionPath < $(Build.SourcesDirectory)/eng/PoliCheckExclusions.xml")'
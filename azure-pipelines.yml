trigger: none
pr: none

variables:
- template: /eng/common/templates-official/variables/pool-providers.yml@self

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: Permissive, CFSClean, CFSClean2
    pool:
      name: $(DncEngInternalBuildPool)
      image: windows.vs2026.amd64
      os: windows
    sdl:
      policheck:
        enabled: true
      tsa:
        enabled: true
      binskim:
        scanOutputDirectoryOnly: true
        analyzeTargetGlob: +:f|**/artifacts/**/*.dll;+:f|**/artifacts/**/*.exe;-:f|**/*.Tests/**/*;-:f|**/wix/**/*;-:f|**/wix3/**/*;-:f|**/winterop.dll;

    stages:
    - stage: OneLocValidation
      displayName: Validate updated OneLocBuild v3 from Azure Repos
      jobs:
      - template: /eng/common/templates-official/job/onelocbuild.yml@self
        parameters:
          MirrorRepo: arcade
          MirrorBranch: users/mjanecke/oneloc-v3-retry-ci-17717
          LclSource: lclFilesFromPackage
          LclPackageId: LCL-JUNO-PROD-ARCADE
          CreatePr: true
          AutoCompletePr: false
          ReusePr: false
